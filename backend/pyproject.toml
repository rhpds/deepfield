[project]
name = "deepfield-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.10",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "asyncpg>=0.30",
    "kafka-python>=2.0",
    "celery[redis]>=5.4",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"app.prompts" = ["templates/*.yaml"]
"app.nanoagents" = ["*.yaml"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]
