[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intel-inference-router"
version = "0.1.0"
description = "Intel CPU Inference Routing Engine — benchmark-graded model selection for Xeon deployments"
readme = "CLAUDE.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
compile-corpora = "intel_inference_router.compile_corpora:main"

[tool.setuptools.packages.find]
include = ["intel_inference_router*"]

[tool.setuptools.package-data]
intel_inference_router = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
