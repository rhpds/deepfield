# Benchmark-validated model ladder — Phase 1 optimized
# CPU pinning (Guaranteed QoS), continuous batching, NUMA-aware threading
---
# phi4-mini — primary generative model (95% quality, 3.0s)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-phi4-mini
  labels:
    app: llama-phi4-mini
    lane: generation
    tier: "1"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: llama-phi4-mini
  template:
    metadata:
      labels:
        app: llama-phi4-mini
        lane: generation
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: llama-phi4-mini
      containers:
      - name: llama
        image: ghcr.io/ggml-org/llama.cpp:server
        args:
        - "--model"
        - "/models/gguf/phi4-mini/microsoft_Phi-4-mini-instruct-Q4_K_M.gguf"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8080"
        - "--ctx-size"
        - "8192"
        - "--threads"
        - "8"
        - "--parallel"
        - "4"
        - "--cpu-strict"
        - "1"
        - "--alias"
        - "phi4-mini"
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "8"
            memory: "8Gi"
          limits:
            cpu: "8"
            memory: "8Gi"
        volumeMounts:
        - name: models
          mountPath: /models
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: llama-phi4-mini
spec:
  selector:
    app: llama-phi4-mini
  ports:
  - port: 8080
    targetPort: 8080
---
