---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-qwen36-moe
  namespace: intel-inference
  labels:
    app: llama-qwen36-moe
    app.kubernetes.io/part-of: intel-inference-router
    intel.com/runtime: llama-cpp
    intel.com/lane: reasoning
    intel.com/tier: macro
spec:
  replicas: 0
  selector:
    matchLabels:
      app: llama-qwen36-moe
  template:
    metadata:
      labels:
        app: llama-qwen36-moe
        intel.com/runtime: llama-cpp
        intel.com/lane: reasoning
        intel.com/tier: macro
    spec:
      containers:
        - name: llama-cpp
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - "--model"
            - "/models/gguf/qwen36-moe/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--ctx-size"
            - "4096"
            - "--threads"
            - "32"
            - "--alias"
            - "qwen36-moe"
            - "--reasoning-format"
            - "none"
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          volumeMounts:
            - name: model-cache
              mountPath: /models
          resources:
            requests:
              cpu: "32"
              memory: 32Gi
            limits:
              cpu: "32"
              memory: 32Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: llama-qwen36-moe
  namespace: intel-inference
  labels:
    app: llama-qwen36-moe
    app.kubernetes.io/part-of: intel-inference-router
spec:
  type: ClusterIP
  selector:
    app: llama-qwen36-moe
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
