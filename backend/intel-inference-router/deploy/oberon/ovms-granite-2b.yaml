---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovms-granite-2b
  namespace: intel-inference
  labels:
    app: ovms-granite-2b
    app.kubernetes.io/part-of: intel-inference-router
    intel.com/runtime: ovms
    intel.com/lane: classification
    intel.com/tier: micro
spec:
  replicas: 0
  selector:
    matchLabels:
      app: ovms-granite-2b
  template:
    metadata:
      labels:
        app: ovms-granite-2b
        intel.com/runtime: ovms
        intel.com/lane: classification
        intel.com/tier: micro
    spec:
      containers:
        - name: ovms
          image: openvino/model_server:latest
          args:
            - "--model_name"
            - "granite-2b"
            - "--model_path"
            - "/models/ov/granite-2b"
            - "--rest_port"
            - "8080"
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          volumeMounts:
            - name: model-cache
              mountPath: /models
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /v1/config
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/config
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: ovms-granite-2b
  namespace: intel-inference
  labels:
    app: ovms-granite-2b
    app.kubernetes.io/part-of: intel-inference-router
spec:
  type: ClusterIP
  selector:
    app: ovms-granite-2b
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
