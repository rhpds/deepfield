apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: intel-inference

labels:
  - pairs:
      intel.com/fleet: oberon
      app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - models-pvc.yaml
  - ovms-granite-2b.yaml
  - ovms-smollm2-360m.yaml
  - llama-smollm3-3b.yaml
  - llama-qwen36-moe.yaml
  - proxy.yaml

# Scale targets after models are downloaded:
#   oc scale deploy/ovms-smollm2-360m --replicas=4 -n intel-inference
#   oc scale deploy/ovms-granite-2b   --replicas=1 -n intel-inference
#   oc scale deploy/llama-smollm3-3b  --replicas=1 -n intel-inference
#   oc scale deploy/llama-qwen36-moe  --replicas=1 -n intel-inference
#   oc scale deploy/inference-proxy   --replicas=1 -n intel-inference
